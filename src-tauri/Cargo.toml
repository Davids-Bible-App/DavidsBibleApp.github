[package]
name = "davidsbible"
version = "1.0.3"
description = "Davids Bible Application And Study Tool"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "davidsbible_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-dialog = "2.7.0"
tauri-plugin-opener = "2.5.0"
tauri = { version = "^2", features = [ "protocol-asset" ] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-os = "2"
tauri-plugin-m3 = "0.2.2"
tauri-plugin-sharekit = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
# tauri-plugin-log = "2.8.0"
log = "0.4.29"
zip = "0.6"
regex = "=1.12.2"
tauri-plugin-haptics = "2"
tauri-plugin-process = "2"
tauri-plugin-keep-screen-on = "0.1.4"
alphanumeric-sort = "1.5.6"
tokio = { version = "1", features = ["time", "sync", "macros"] }
async-trait = "0.1.89"
tauri-plugin-notification = "2"
tauri-plugin-background-service = "0.5"
tauri-plugin-music-notification-api = { git = "https://github.com/AverTry/tauri-plugin-music-notification", branch = "main" }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2.0.0"
